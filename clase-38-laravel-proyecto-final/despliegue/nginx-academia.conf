# /etc/nginx/sites-available/academia
# Basado en la configuración recomendada en la documentación de Laravel
server {
    listen 80;
    listen [::]:80;
    server_name academia-alpe.es www.academia-alpe.es;

    # ¡La carpeta public/, nunca la raíz del proyecto!
    root /var/www/academia/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # Todo lo que no sea un fichero existente va al front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nada de ficheros ocultos (.env, .git...)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
