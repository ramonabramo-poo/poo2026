# Ejercicio 03: GitHub ejecuta las pruebas en cada push y en cada pull request
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Instalar las dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Preparar el .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Comprobar el estilo con Pint
        run: ./vendor/bin/pint --test

      - name: Ejecutar las pruebas
        run: php artisan test
