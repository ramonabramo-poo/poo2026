; /etc/supervisor/conf.d/academia-worker.conf
; Supervisor mantiene vivo el worker de la cola: si se cae, lo vuelve a lanzar
[program:academia-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/academia/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/academia/storage/logs/worker.log
stopwaitsecs=3600
