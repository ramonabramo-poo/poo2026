<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Saludo con GET</title>
</head>
<body>
    <h1>¿Cómo te llamas?</h1>

    <!-- action: la página que recibirá los datos. method: cómo viajan (en la URL) -->
    <form action="02-saludo-get.php" method="get">
        <p>
            <!-- for y id unen la etiqueta con su campo: al pulsar el texto, se activa la caja -->
            <label for="nombre">Nombre</label>
            <!-- name: la CLAVE con la que PHP leerá este dato -->
            <input type="text" id="nombre" name="nombre">
        </p>
        <p>
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad">
        </p>
        <button type="submit">Saludar</button>
    </form>
</body>
</html>
